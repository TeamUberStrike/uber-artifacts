name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v6
      - name: Set proxy URL
        env:
          ARTIFACTS_PROXY_URL: ${{ vars.ARTIFACTS_PROXY_URL }}
        run: |
          if [ -n "$ARTIFACTS_PROXY_URL" ]; then
            sed -i "s|https://uber-artifacts-proxy.YOUR-SUBDOMAIN.workers.dev|$ARTIFACTS_PROXY_URL|" site/config.js
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
